name: Bug report
description: Report a reproducible problem
title: '[Bug] '
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected behavior. Remove keys and personal data from logs.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Node/Python versions, commit or release version
